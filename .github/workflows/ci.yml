name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Gateway (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  console-api:
    name: console-api (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/cloud/console-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/services/cloud/console-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx jest

  frontends:
    name: ${{ matrix.app }} (build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: dashboard
            dir: src/tools/dashboard
            args: ""
          - app: console
            dir: src/saas/netsentry-console
            args: "-- --base-href /console/"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --include=optional
      - run: npm run build ${{ matrix.args }}

  deploy-config:
    name: Compose and shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose configuration
        run: |
          sed -e 's/^\(MONGO_ROOT_PASSWORD\|MONGO_APP_PASSWORD\|REDIS_PASSWORD\|JWT_SECRET\|GRAFANA_ADMIN_PASSWORD\|ADMIN_PASSWORD\)=.*/\1=ci-placeholder-value-0123456789abcdef/' .env.example > ci.env
          docker compose --env-file ci.env config -q
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e DOMAIN=cloud.example.com -v "$PWD/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh

  e2e:
    name: End-to-end (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rust, console-api, frontends, deploy-config]
    steps:
      - uses: actions/checkout@v4
      - name: Install and start the stack on localhost
        run: ./install.sh --yes --domain localhost --admin-email admin@example.org
      - name: Smoke test
        run: |
          set -euo pipefail
          export ADMIN_EMAIL=admin@example.org
          ADMIN_PASSWORD="$(sed -n 's/^ADMIN_PASSWORD=//p' .env)"
          export ADMIN_PASSWORD
          for _ in $(seq 1 60); do
            curl -ksf https://localhost/api/health >/dev/null && break
            sleep 2
          done
          BASE_URL=https://localhost INSECURE=1 ./scripts/e2e-smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
