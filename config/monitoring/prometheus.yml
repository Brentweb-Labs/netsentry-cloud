global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Gateway exposes /metrics on its internal port only (Caddy does not route it).
  - job_name: netsentry-gateway
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['api-gateway:8080']
