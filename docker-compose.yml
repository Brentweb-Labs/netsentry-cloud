# NetSentry Cloud - single-host stack with automatic TLS (Caddy).
# Configure via .env (run ./install.sh to generate it).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      - api-gateway
      - console-api
      - console-frontend
      - dashboard
    logging: *logging

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: idps_database
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  api-gateway:
    build:
      context: .
      dockerfile: src/services/cloud/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://idps_app:${MONGO_APP_PASSWORD}@mongodb:27017/idps_database?authSource=idps_database
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_URL: https://${DOMAIN}
      THREAT_FEED_URLS: ${THREAT_FEED_URLS:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    networks: [internal]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  console-api:
    build:
      context: .
      dockerfile: src/services/cloud/console-api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8095"
      MONGODB_URI: mongodb://idps_app:${MONGO_APP_PASSWORD}@mongodb:27017/idps_database?authSource=idps_database
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      RUST_API_URL: http://api-gateway:8080
    networks: [internal]
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8095/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  console-frontend:
    build:
      context: .
      dockerfile: src/saas/netsentry-console/Dockerfile
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  dashboard:
    build:
      context: .
      dockerfile: src/tools/dashboard/Dockerfile
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [internal]
    depends_on:
      - prometheus
    logging: *logging

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  internal:
