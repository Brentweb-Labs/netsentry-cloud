<!-- Dashboard Layout -->
<div class="min-h-[100dvh] bg-mesh-gradient flex">
  <!-- Sidebar - fixed on desktop -->
  <aside class="fixed inset-y-0 left-0 z-40 w-64 transform lg:translate-x-0 transition-transform duration-500"
         [class.-translate-x-full]="!drawerOpen()"
         [class.translate-x-0]="drawerOpen()">

    <!-- Sidebar Backdrop (mobile) -->
    <div class="lg:hidden fixed inset-0 bg-base-100/50 backdrop-blur-sm"
         [class.hidden]="drawerOpen()"
         (click)="drawerOpen.set(false)"></div>

    <!-- Sidebar Content -->
    <div class="nav-glass h-full rounded-r-xl flex flex-col border-r border-base-300/30">
      <!-- Logo Section -->
      <div class="p-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center">
            <svg class="w-5 h-5 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
          </div>
          <div>
            <p class="text-lg font-semibold">NetSentry</p>
            <p class="text-xs text-base-content/50 uppercase tracking-wider">Console</p>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-3 py-2 overflow-y-auto">
        <p class="text-xs font-medium text-base-content/40 px-3 py-2 uppercase tracking-wider mb-1">Management</p>

        @for (item of nav; track item.route; let i = $index) {
          <a [routerLink]="item.route"
             routerLinkActive="bg-primary/10 text-primary"
             (click)="linkClicked.emit()"
             class="flex items-center gap-3 px-4 py-2.5 rounded-lg mb-0.5 transition-all duration-300 hover:bg-base-200/50 group">
            <svg class="w-5 h-5 text-base-content/50 group-hover:text-primary transition-colors"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon"/>
            </svg>
            <span class="text-sm font-medium">{{ item.label }}</span>
          </a>
        }
      </nav>

      <!-- Footer Link -->
      <div class="p-3 border-t border-base-300/30">
        <a href="/idps" target="_blank"
           class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-base-content/60 hover:text-primary hover:bg-base-200/50 transition-all duration-300">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span class="text-sm">IDPS Dashboard</span>
          <svg class="w-4 h-4 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 lg:ml-64 flex flex-col">
    <!-- Topbar -->
    <app-console-topbar (menuToggle)="drawerOpen.set(!drawerOpen())" />

    <!-- Page Content -->
    <main class="flex-1 p-5 mt-16 min-h-[calc(100dvh-4rem)]">
      <router-outlet />
    </main>
  </div>
</div>
