<ul class="menu bg-base-100 min-h-full w-64 p-4 gap-1">
  <!-- Logo -->
  <li class="mb-4">
    <div class="flex items-center gap-3 px-2 py-1 pointer-events-none">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
        <svg class="w-5 h-5 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <div>
        <p class="text-sm font-bold leading-none">NetSentry</p>
        <p class="text-xs text-base-content/50 uppercase tracking-widest">Console</p>
      </div>
    </div>
  </li>

  <li class="menu-title text-xs mt-2">Management</li>

  @for (item of nav; track item.route) {
    <li>
      <a [routerLink]="item.route" routerLinkActive="active"
         (click)="linkClicked.emit()" class="gap-3">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon"/>
        </svg>
        {{ item.label }}
      </a>
    </li>
  }

  <div class="divider my-2"></div>

  <li>
    <a href="/idps" target="_blank" class="gap-3 text-base-content/60">
      <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      IDPS Dashboard ↗
    </a>
  </li>
</ul>
