<!-- Top Navigation Bar -->
<header class="fixed top-0 right-0 left-0 lg:left-64 z-30 h-16">
  <div class="nav-glass h-full px-4 flex items-center justify-between border-b border-base-300/50">

    <!-- Left: Hamburger + Breadcrumb -->
    <div class="flex items-center gap-3">
      <!-- Mobile Hamburger -->
      <label class="lg:hidden btn btn-ghost btn-square btn-sm" (click)="menuToggle.emit()">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </label>

      <!-- Page Title Placeholder -->
      <div class="hidden sm:block">
        <h1 class="text-lg font-semibold">Dashboard</h1>
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2">

      <!-- Search (hidden for now) -->
      <div class="hidden md:flex items-center">
        <div class="relative">
          <input type="text" placeholder="Search..."
                 class="input input-sm input-bordered w-48 pl-9 bg-transparent focus:outline-none focus:border-primary/50 transition-all duration-300" />
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Theme Toggle -->
      <label class="swap swap-rotate btn btn-ghost btn-square btn-sm" title="Toggle theme">
        <input type="checkbox" class="theme-controller"
               [checked]="isDarkMode"
               (change)="toggleTheme($event)" />
        <!-- Sun icon -->
        <svg class="swap-off w-5 h-5 text-base-content/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7Z"/>
        </svg>
        <!-- Moon icon -->
        <svg class="swap-on w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75 9.75 9.75 0 0 1 8.25 6c0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 12c0 5.385 4.365 9.75 9.75 9.75 4.114 0 7.651-2.548 9.002-6.168Z"/>
        </svg>
      </label>

      <!-- Notifications -->
      <button class="btn btn-ghost btn-square btn-sm relative">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full"></span>
      </button>

      <!-- User Menu -->
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-sm gap-2 normal-case pl-1 pr-3">
          <div class="avatar placeholder">
            <div class="bg-gradient-to-br from-primary to-primary/80 text-primary-content rounded-full w-8 shadow-lg shadow-primary/25">
              <span class="text-xs font-bold">{{ initials }}</span>
            </div>
          </div>
          <span class="hidden lg:inline text-sm font-medium">{{ roleLabel }}</span>
          <svg class="w-4 h-4 text-base-content/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-2xl w-56 p-3 shadow-xl border border-base-300/50 mt-3 animate-scale-in">
          <div class="p-3 border-b border-base-300/50 mb-2">
            <p class="text-sm font-semibold">Account</p>
            <p class="text-xs text-base-content/50 truncate">{{ orgId }}</p>
          </div>
          <li class="menu-title text-xs text-base-content/40 uppercase tracking-wider">Settings</li>
          <li>
            <button class="flex items-center gap-3">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Preferences
            </button>
          </li>
          <li>
            <button class="flex items-center gap-3 text-error">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Sign out
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
