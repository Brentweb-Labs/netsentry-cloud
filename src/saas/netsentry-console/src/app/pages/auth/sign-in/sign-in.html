<!-- Clean Brutalist Login -->
<div class="min-h-screen bg-white flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <!-- Header -->
    <div class="mb-12">
      <div class="mb-8">
        <h1 class="text-5xl font-light tracking-tight text-black" style="font-family: 'Georgia', 'Garamond', serif">
          Sign in
        </h1>
      </div>
      <p class="text-base text-gray-600 leading-relaxed">
        Access your NetSentry security console
      </p>
    </div>

    <!-- Error Alert -->
    @if (error()) {
      <div class="mb-6 p-4 border border-red-300 bg-red-50">
        <div class="flex gap-3">
          <div class="flex-shrink-0">
            <svg class="w-5 h-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/>
            </svg>
          </div>
          <p class="text-sm text-red-800">{{ error() }}</p>
        </div>
      </div>
    }

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-900 mb-2">
          Email
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 border border-gray-300 bg-white text-black placeholder-gray-400 focus:outline-none focus:border-black transition-colors"
          placeholder="user@example.com" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-900 mb-2">
          Password
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full px-4 py-3 border border-gray-300 bg-white text-black placeholder-gray-400 focus:outline-none focus:border-black transition-colors"
          placeholder="••••••••" />
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full px-4 py-3 bg-black text-white font-medium hover:bg-gray-900 active:bg-black transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
        [disabled]="form.invalid || loading()">
        @if (loading()) {
          <span class="inline-flex items-center gap-2">
            <span class="loading loading-spinner loading-sm"></span>
            Signing in...
          </span>
        } @else {
          Sign in
        }
      </button>
    </form>

    <!-- Footer -->
    <p class="text-xs text-gray-500 text-center mt-8">
      © 2026 NetSentry. All rights reserved.
    </p>
  </div>
</div>

<style>
  :host {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  }
</style>
