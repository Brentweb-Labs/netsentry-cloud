<!-- Empty State -->
<div class="flex flex-col items-center justify-center py-12 text-center gap-3">
  <div class="w-14 h-14 rounded-xl bg-base-200/50 flex items-center justify-center">
    <svg class="w-7 h-7 text-base-content/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIconPath()"/>
    </svg>
  </div>
  <h3 class="font-semibold text-base-content">{{ title }}</h3>
  @if (description) {
    <p class="text-sm text-base-content/60 max-w-xs">{{ description }}</p>
  }
  @if (actionLabel) {
    @if (routerLink) {
      <a [routerLink]="routerLink" class="btn btn-primary btn-sm mt-2">
        {{ actionLabel }}
      </a>
    } @else {
      <button class="btn btn-primary btn-sm mt-2" (click)="action.emit()">
        {{ actionLabel }}
      </button>
    }
  }
</div>
