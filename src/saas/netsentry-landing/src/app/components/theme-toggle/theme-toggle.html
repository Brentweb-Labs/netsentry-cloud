<button
  (click)="toggle()"
  class="w-9 h-9 rounded-full flex items-center justify-center text-base-content/50 hover:text-base-content hover:bg-base-content/8 active:scale-[0.94]"
  style="transition: all 0.35s cubic-bezier(0.32,0.72,0,1)"
  [title]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  aria-label="Toggle theme"
>
  @if (isDark()) {
    <!-- Sun icon -->
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  } @else {
    <!-- Moon icon -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  }
</button>
